<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            padding: 25px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 16px;
        }
        
        .chat-container {
            height: 500px;
            display: flex;
            flex-direction: column;
        }
        
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f9f9f9;
        }
        
        .message {
            margin-bottom: 15px;
            display: flex;
        }
        
        .message.user {
            justify-content: flex-end;
        }
        
        .message.bot {
            justify-content: flex-start;
        }
        
        .message-content {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 18px;
            line-height: 1.4;
            font-size: 15px;
        }
        
        .user .message-content {
            background: #4CAF50;
            color: white;
            border-bottom-right-radius: 5px;
        }
        
        .bot .message-content {
            background: white;
            color: #333;
            border: 1px solid #ddd;
            border-bottom-left-radius: 5px;
        }
        
        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }
        
        #user-input {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        #user-input:focus {
            border-color: #4CAF50;
        }
        
        #send-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        #send-btn:hover {
            background: #45a049;
        }
        
        .typing-indicator {
            display: none;
            padding: 10px;
            color: #666;
            font-style: italic;
        }
        
        .quick-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 15px 20px;
            background: #f5f5f5;
            border-bottom: 1px solid #eee;
        }
        
        .quick-btn {
            padding: 8px 16px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .quick-btn:hover {
            background: #4CAF50;
            color: white;
            border-color: #4CAF50;
        }
        
        @media (max-width: 600px) {
            .container {
                margin: 10px;
            }
            
            .header {
                padding: 20px 15px;
            }
            
            .chat-box {
                padding: 15px;
            }
            
            .input-area {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏥 Healthcare Assistant</h1>
            <p>Describe your symptoms for personalized health guidance</p>
        </div>
        
        <div class="quick-buttons">
            <button class="quick-btn" onclick="quickMessage('I have fever')">Fever</button>
            <button class="quick-btn" onclick="quickMessage('I have headache')">Headache</button>
            <button class="quick-btn" onclick="quickMessage('I have cold and cough')">Cold & Cough</button>
            <button class="quick-btn" onclick="quickMessage('I have stomach pain')">Stomach Pain</button>
            <button class="quick-btn" onclick="quickMessage('I feel anxious')">Anxiety</button>
            <button class="quick-btn" onclick="quickMessage('I have sleep problems')">Sleep Issues</button>
        </div>
        
        <div class="chat-container">
            <div class="chat-box" id="chat-box">
                <!-- Messages will appear here -->
                <div class="message bot">
                    <div class="message-content">
                        👋 Hello! I'm your healthcare assistant. I can help with symptom checking and basic health advice. Please describe your symptoms or health concern.
                    </div>
                </div>
            </div>
            
            <div class="typing-indicator" id="typing">Bot is typing...</div>
            
            <div class="input-area">
                <input type="text" id="user-input" placeholder="Type your symptoms here..." onkeypress="handleKeyPress(event)">
                <button id="send-btn" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        let sessionId = null;
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const typingIndicator = document.getElementById('typing');
        
        function addMessage(message, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            // Format message with line breaks
            const formattedMessage = message.replace(/\n/g, '<br>');
            contentDiv.innerHTML = formattedMessage;
            
            messageDiv.appendChild(contentDiv);
            chatBox.appendChild(messageDiv);
            
            // Scroll to bottom
            chatBox.scrollTop = chatBox.scrollHeight;
        }
        
        function showTyping() {
            typingIndicator.style.display = 'block';
            chatBox.scrollTop = chatBox.scrollHeight;
        }
        
        function hideTyping() {
            typingIndicator.style.display = 'none';
        }
        
        function quickMessage(text) {
            userInput.value = text;
            sendMessage();
        }
        
        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;
            
            // Add user message
            addMessage(message, 'user');
            userInput.value = '';
            
            // Show typing indicator
            showTyping();
            
            try {
                // Prepare request data
                const requestData = {
                    message: message
                };
                
                // Add session ID if we have one
                if (sessionId) {
                    requestData.session_id = sessionId;
                }
                
                // Send to backend
                const response = await fetch('http://localhost:5000/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestData)
                });
                
                const data = await response.json();
                
                // Store session ID if received
                if (data.session_id && !sessionId) {
                    sessionId = data.session_id;
                    console.log('Session started:', sessionId);
                }
                
                // Hide typing indicator
                hideTyping();
                
                // Add bot response
                if (data.response) {
                    addMessage(data.response, 'bot');
                } else {
                    addMessage('Sorry, I encountered an error. Please try again.', 'bot');
                }
                
            } catch (error) {
                hideTyping();
                addMessage(`Error: ${error.message}. Make sure the backend server is running.`, 'bot');
                console.error('Error:', error);
            }
        }
        
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
        
        // Focus on input field when page loads
        window.onload = function() {
            userInput.focus();
        };
    </script>
</body>
</html>
