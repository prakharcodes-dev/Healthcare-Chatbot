<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthChat - Symptom Checker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #1a2a3a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: #2c3e50;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .chat-container {
            height: 550px;
            display: flex;
            flex-direction: column;
            background: #f5f5f5;
        }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .message {
            display: flex;
            margin-bottom: 20px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
        }

        .user .message-content {
            background: #2c3e50;
            color: white;
            border-bottom-right-radius: 5px;
        }

        .bot .message-content {
            background: white;
            color: #333;
            border: 1px solid #ddd;
            border-bottom-left-radius: 5px;
        }

        .message-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 8px;
            font-size: 16px;
        }

        .bot-avatar {
            background: #2c3e50;
            color: white;
        }

        .user-avatar {
            background: #3498db;
            color: white;
        }

        .typing-indicator {
            display: none;
            padding: 10px 20px;
            color: #666;
            font-style: italic;
            background: #eee;
            border-top: 1px solid #ddd;
        }

        .typing-dots {
            display: inline-block;
            margin-right: 10px;
        }

        .typing-dots span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-5px); }
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 10px;
        }

        #user-input {
            flex: 1;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 15px;
        }

        #user-input:focus {
            outline: none;
            border-color: #2c3e50;
        }

        .action-btn {
            background: #2c3e50;
            color: white;
            border: none;
            padding: 0 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
        }

        .action-btn:hover {
            background: #34495e;
        }

        .suggestions {
            display: flex;
            gap: 8px;
            padding: 10px 20px;
            background: #eee;
            overflow-x: auto;
            white-space: nowrap;
        }

        .suggestion-chip {
            background: white;
            border: 1px solid #ccc;
            border-radius: 20px;
            padding: 8px 15px;
            color: #333;
            font-size: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .suggestion-chip:hover {
            background: #2c3e50;
            color: white;
        }

        .match-highlight {
            color: #2c3e50;
            font-weight: bold;
        }

        .warning {
            background: #fff3cd;
            border: 1px solid #ffeeba;
            color: #856404;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-robot"></i> HealthChat</h1>
            <p>Tell me your symptoms and I'll help you</p>
        </div>

        <div class="chat-container">
            <div class="chat-box" id="chat-box">
                <div class="message bot">
                    <div class="message-avatar bot-avatar">
                        <i class="fas fa-robot"></i>
                    </div>
                    <div class="message-content">
                        👋 Hi! I'm your health assistant.<br>
                        Please describe your symptoms.<br>
                        <small>Example: fever, headache, tired</small>
                    </div>
                </div>
            </div>

            <div class="suggestions">
                <div class="suggestion-chip" onclick="quickSymptom('fever, headache')">
                    <i class="fas fa-thermometer-half"></i> Fever + Headache
                </div>
                <div class="suggestion-chip" onclick="quickSymptom('cough, sore throat')">
                    <i class="fas fa-lungs"></i> Cough + Sore throat
                </div>
                <div class="suggestion-chip" onclick="quickSymptom('fatigue, joint pain')">
                    <i class="fas fa-bone"></i> Fatigue + Joint pain
                </div>
                <div class="suggestion-chip" onclick="quickSymptom('nausea, vomiting')">
                    <i class="fas fa-stomach"></i> Nausea + Vomiting
                </div>
            </div>

            <div class="typing-indicator" id="typing">
                <div class="typing-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                Thinking...
            </div>

            <div class="input-area">
                <input type="text" id="user-input" placeholder="Enter symptoms (use commas)">
                <button class="action-btn" onclick="sendMessage()">
                    <i class="fas fa-paper-plane"></i> Send
                </button>
            </div>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const typing = document.getElementById('typing');

        function addMessage(msg, who) {
            let div = document.createElement('div');
            div.className = 'message ' + who;
            
            let avatar = document.createElement('div');
            avatar.className = 'message-avatar ' + who + '-avatar';
            if (who == 'bot') {
                avatar.innerHTML = '<i class="fas fa-robot"></i>';
            } else {
                avatar.innerHTML = '<i class="fas fa-user"></i>';
            }
            
            let content = document.createElement('div');
            content.className = 'message-content';
            content.innerHTML = msg.replace(/\n/g,'<br>');
            
            if (who == 'user') {
                div.appendChild(content);
                div.appendChild(avatar);
            } else {
                div.appendChild(avatar);
                div.appendChild(content);
            }
            
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function showTyping() {
            typing.style.display = 'block';
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function hideTyping() {
            typing.style.display = 'none';
        }

        function quickSymptom(s) {
            userInput.value = s;
            sendMessage();
        }

        async function sendMessage() {
            let text = userInput.value.trim();
            if (text == '') return;
            
            addMessage(text, 'user');
            userInput.value = '';
            showTyping();
            
            try {
                let symptoms = text.split(',').map(s => s.trim().toLowerCase());
                
                let res = await fetch('http://127.0.0.1:5000/predict', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({symptoms: symptoms})
                });
                
                let data = await res.json();
                hideTyping();
                
                if (data.matches && data.matches.length > 0) {
                    let reply = '🔍 I found ' + data.matches.length + ' possible condition(s):\n\n';
                    
                    for (let i = 0; i < data.matches.length; i++) {
                        let d = data.matches[i];
                        reply += '• ' + d.disease + ' (match: ' + d.match_score + ')\n';
                        
                        if (d.specialist && d.specialist != 'N/A') {
                            reply += '  👨‍⚕️ Doctor: ' + d.specialist + '\n';
                        }
                        
                        if (d.prevention_tips && d.prevention_tips != 'N/A') {
                            reply += '  🛡️ Prevention: ' + d.prevention_tips + '\n';
                        }
                        
                        reply += '\n';
                    }
                    
                    reply += '⚠️ This is not a real diagnosis. Please see a doctor!';
                    addMessage(reply, 'bot');
                } else {
                    addMessage('❌ No matching diseases found. Try different symptoms.', 'bot');
                }
                
            } catch (err) {
                hideTyping();
                addMessage('⚠️ Error: Cannot connect to server. Make sure Flask is running!', 'bot');
                console.log(err);
            }
        }

        userInput.addEventListener('keypress', function(e) {
            if (e.key == 'Enter') sendMessage();
        });
    </script>
</body>
</html>
