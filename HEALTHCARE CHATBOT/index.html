<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Healthcare Chatbot</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:20px;}
.container{max-width:800px;margin:auto;background:#fff;border-radius:15px;box-shadow:0 20px 60px rgba(0,0,0,0.3);overflow:hidden;}
.header{background:linear-gradient(135deg,#4CAF50,#45a049);color:#fff;padding:25px;text-align:center;}
.chat-container{height:500px;display:flex;flex-direction:column;}
.chat-box{flex:1;padding:20px;overflow-y:auto;background:#f9f9f9;}
.message{margin-bottom:15px;display:flex;}
.message.user{justify-content:flex-end;}
.message.bot{justify-content:flex-start;}
.message-content{max-width:70%;padding:12px 18px;border-radius:18px;font-size:15px;}
.user .message-content{background:#4CAF50;color:#fff;border-bottom-right-radius:5px;}
.bot .message-content{background:#fff;color:#333;border:1px solid #ddd;border-bottom-left-radius:5px;}
.input-area{padding:20px;border-top:1px solid #eee;display:flex;gap:10px;}
#user-input{flex:1;padding:15px;border:2px solid #e0e0e0;border-radius:25px;font-size:16px;}
#send-btn{background:#4CAF50;color:#fff;border:none;padding:15px 30px;border-radius:25px;cursor:pointer;}
.typing-indicator{display:none;padding:10px;color:#666;font-style:italic;}
</style>
</head>
<body>

<div class="container">
<div class="header">
<h1>🏥 Healthcare Assistant</h1>
<p>Describe your symptoms</p>
</div>

<div class="chat-container">
<div class="chat-box" id="chat-box">
<div class="message bot">
<div class="message-content">
👋 Hello! Tell me your symptoms (example: fever, headache, fatigue)
</div>
</div>
</div>

<div class="typing-indicator" id="typing">Analyzing symptoms...</div>

<div class="input-area">
<input type="text" id="user-input" placeholder="Enter symptoms separated by comma">
<button id="send-btn" onclick="sendMessage()">Send</button>
</div>
</div>
</div>

<script>
const chatBox = document.getElementById('chat-box');
const userInput = document.getElementById('user-input');
const typingIndicator = document.getElementById('typing');

function addMessage(message, sender) {
const msgDiv = document.createElement('div');
msgDiv.className = `message ${sender}`;
const contentDiv = document.createElement('div');
contentDiv.className = 'message-content';
contentDiv.innerHTML = message.replace(/\n/g,'<br>');
msgDiv.appendChild(contentDiv);
chatBox.appendChild(msgDiv);
chatBox.scrollTop = chatBox.scrollHeight;
}

function showTyping(){typingIndicator.style.display='block';}
function hideTyping(){typingIndicator.style.display='none';}

async function sendMessage() {
const text = userInput.value.trim();
if(!text) return;

addMessage(text,'user');
userInput.value='';
showTyping();

try{
const symptomsArray = text.split(',').map(s => s.trim().toLowerCase());

const response = await fetch('http://127.0.0.1:5000/predict',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({symptoms:symptomsArray})
});

const data = await response.json();
hideTyping();

if(data.matches && data.matches.length>0){
let reply = "🩺 Possible conditions:\n\n";
data.matches.forEach(d=>{
reply += `• <b>${d.disease}</b> (match score: ${d.match_score})<br>`;
});
addMessage(reply,'bot');
}else{
addMessage("❌ No matching disease found. Try more specific symptoms.",'bot');
}

}catch(error){
hideTyping();
addMessage("⚠️ Backend not running or CORS issue",'bot');
console.error(error);
}
}

userInput.addEventListener("keypress",function(e){
if(e.key==="Enter") sendMessage();
});
</script>

</body>
</html>
